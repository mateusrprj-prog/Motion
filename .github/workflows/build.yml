name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Localizar e extrair o .zip do projeto
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './node_modules/*' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          if [ -z "$ZIP" ]; then echo "Nenhum .zip encontrado no repositório."; exit 1; fi
          echo "Usando: $ZIP"
          mkdir -p _project
          unzip -q -o "$ZIP" -d _project
          PKG=$(find _project -name package.json -not -path '*/node_modules/*' | head -n1)
          if [ -z "$PKG" ]; then echo "package.json não encontrado dentro do zip."; exit 1; fi
          echo "APP_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Aceitar licenças do Android SDK (SDK já vem no runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependências
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npx expo install --fix

      - name: Gerar projeto nativo
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK (arm64 - POCO X7 Pro)
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: motion-studio-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
          
